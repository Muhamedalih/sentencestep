name: Uptime check

# Every five minutes, asks the live site for its home page. If it does not answer
# correctly three times in a row (about a minute apart), the run fails and GitHub
# e-mails the repository owner. It costs nothing (public repository) and needs no
# account anywhere else. GitHub runs scheduled workflows on a best-effort basis (a run
# can start a few minutes late), so this is an early warning, not a guarantee.
#
# Once the site runs on its own server it also checks /api/health, which reports whether
# the app process is alive; before that the route does not exist (404) and is ignored.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The home page answers
        env:
          SITE: https://sentencestep.com
        run: |
          set -u
          ok=0
          for attempt in 1 2 3; do
            code="$(curl -sS -o home.html -w '%{http_code}' --max-time 20 "$SITE/" || true)"; code="${code:-000}"
            if [ "$code" = 200 ] && grep -q 'SentenceStep' home.html; then
              echo "home page ok (HTTP $code)"
              ok=1
              break
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 25
          done
          if [ "$ok" != 1 ]; then
            echo "::error::$SITE is not answering correctly"
            exit 1
          fi

      - name: The app reports healthy (once /api/health exists)
        env:
          SITE: https://sentencestep.com
        run: |
          set -u
          code="$(curl -sS -o health.json -w '%{http_code}' --max-time 20 "$SITE/api/health" || true)"; code="${code:-000}"
          if [ "$code" = 404 ]; then
            echo "/api/health does not exist yet (still on the old host) - skipped"
            exit 0
          fi
          if [ "$code" = 200 ] && [ "$(jq -r '.status // empty' health.json)" = ok ]; then
            echo "health ok"
            exit 0
          fi
          echo "::error::/api/health answered HTTP $code"
          exit 1
