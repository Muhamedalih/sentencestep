name: Uptime check

# Every five minutes, asks the live site for its home page and for /api/health. If either does not
# answer correctly three times in a row (about 25 seconds apart), the run fails and GitHub e-mails
# the person who last edited this schedule (the repository owner). It costs nothing (public
# repository) and needs no account anywhere else. GitHub runs scheduled workflows on a best-effort
# basis (a run can start a few minutes late), so this is an early warning, not a guarantee.
#
# /api/health reports whether the app process is alive; it touches no database, so a Supabase bad
# minute does not make the site look dead. The site runs on its own server, so a missing route
# (404) is a failure like any other.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The home page answers
        env:
          SITE: https://sentencestep.com
        run: |
          set -u
          ok=0
          for attempt in 1 2 3; do
            code="$(curl -sS -o home.html -w '%{http_code}' --max-time 20 "$SITE/" || true)"; code="${code:-000}"
            if [ "$code" = 200 ] && grep -q 'SentenceStep' home.html; then
              echo "home page ok (HTTP $code)"
              ok=1
              break
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 25
          done
          if [ "$ok" != 1 ]; then
            echo "::error::$SITE is not answering correctly"
            exit 1
          fi

      - name: The app reports healthy
        env:
          SITE: https://sentencestep.com
        run: |
          set -u
          ok=0
          for attempt in 1 2 3; do
            code="$(curl -sS -o health.json -w '%{http_code}' --max-time 20 "$SITE/api/health" || true)"; code="${code:-000}"
            if [ "$code" = 200 ] && [ "$(jq -r '.status // empty' health.json)" = ok ]; then
              echo "health ok"
              ok=1
              break
            fi
            echo "attempt $attempt: /api/health answered HTTP $code"
            sleep 25
          done
          if [ "$ok" != 1 ]; then
            echo "::error::$SITE/api/health is not answering correctly"
            exit 1
          fi
