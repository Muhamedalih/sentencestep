name: Deploy to the self-hosted server

# Builds the Docker image on GitHub's runner and ships it to the server over SSH
# (deploy/deploy.sh does the zero-downtime switch there). Replaces what Netlify did on
# every push. Nothing here runs until the server exists AND the repository variable
# `DEPLOY_ENABLED` is set to `true` — until then the jobs are skipped, not failed.
#
# This repository is public, so the logs of every run are public too: the server's
# address is therefore a SECRET (GitHub masks secrets in logs; variables it does not),
# and nothing in this file may ever print a secret.
#
# This feeds the live site (DEPLOY_URL = https://sentencestep.com). Publishing is what it
# was on Netlify: push to the `release` branch (`git push origin master:release`). Pushes
# to `master` do not deploy anything. To deploy any other branch or commit by hand:
# Actions -> this workflow -> Run workflow -> pick the branch. To roll the live site back
# without deploying anything: the same button, tick "rollback".
#
# Repository variables:  DEPLOY_ENABLED (`true` to switch the workflow on) and DEPLOY_URL (the
#   address of the site this run feeds; it also becomes NEXT_PUBLIC_SITE_URL in the build).
# Repository secrets:    SERVER_HOST (the server's address), SERVER_SSH_KEY (the CI deploy
#   private key), NEXT_SERVER_ACTIONS_ENCRYPTION_KEY, and optionally CF_ACCESS_CLIENT_ID /
#   CF_ACCESS_CLIENT_SECRET (a Cloudflare Access service token, when the target is
#   protected by Cloudflare Access).
# Committed, not configured:
#   - deploy/build-public.env: the five public values that are the same for every target
#     (Supabase URL and anon key, Sentry DSN, Turnstile site key, VAPID public key);
#   - deploy/known_hosts: the server's PUBLIC SSH host key, written under the name `server`
#     (never the address - a variable or file with the address would be readable in this
#     public repository's run logs). Regenerate with
#     `ssh-keyscan -t ed25519 <server> | grep -v '^#' | awk '{print "server", $2, $3}'`.

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      rollback:
        description: "Roll back to the previous release instead of deploying"
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    if: ${{ vars.DEPLOY_ENABLED == 'true' && !inputs.rollback }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

  deploy:
    needs: checks
    # `checks` is skipped on a rollback run; the deploy job must still run then.
    if: ${{ always() && vars.DEPLOY_ENABLED == 'true' && (inputs.rollback || needs.checks.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 644 deploy/known_hosts ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName ${SERVER_HOST}
            HostKeyAlias server
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
          EOF

      - name: Roll back
        if: ${{ inputs.rollback }}
        run: ssh server rollback

      - name: Load the public build values
        if: ${{ !inputs.rollback }}
        run: |
          # The five values that are the same everywhere come from the committed file; the
          # site address is the target's own (DEPLOY_URL), so a build for the test copy
          # points at the test copy and a build for the live site points at the live site.
          set -euo pipefail
          case "$DEPLOY_URL" in
            https://*) ;;
            *) echo "::error::DEPLOY_URL must start with https:// (it is '${DEPLOY_URL}')"; exit 1 ;;
          esac
          grep -E '^NEXT_PUBLIC_[A-Z_]+=.+$' deploy/build-public.env >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=${DEPLOY_URL%/}" >> "$GITHUB_ENV"

      - name: Check the configuration is complete
        if: ${{ !inputs.rollback }}
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          # An image built with a public value missing would run, but be broken in the
          # browser; stop here, before anything is built or sent.
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SITE_URL \
                      NEXT_PUBLIC_SENTRY_DSN NEXT_PUBLIC_TURNSTILE_SITE_KEY NEXT_PUBLIC_VAPID_PUBLIC_KEY \
                      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY SERVER_SSH_KEY SERVER_HOST DEPLOY_URL; do
            if [ -z "${!name:-}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          # A short fingerprint (never the key) so the copy in this repository's secrets can
          # be compared with the one in the server's env file: they must be identical, the
          # build and the running server have to use the same Server Actions key.
          echo "Server Actions key fingerprint: $(printf %s "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" | sha256sum | cut -c1-8)"

      - uses: docker/setup-buildx-action@v3
        if: ${{ !inputs.rollback }}

      - name: Build the image
        if: ${{ !inputs.rollback }}
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sentencestep:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ env.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ env.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            GIT_COMMIT_SHA=${{ github.sha }}
          secrets: |
            server_actions_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Send the deploy files and the image to the server, switch traffic
        if: ${{ !inputs.rollback }}
        run: |
          tar -czf - -C deploy . | ssh server sync
          docker save "sentencestep:${GITHUB_SHA}" | gzip -1 | ssh server "deploy ${GITHUB_SHA}"

      - name: Check the live copy
        id: smoke
        if: ${{ !inputs.rollback }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash deploy/smoke-test.sh "$DEPLOY_URL" "$GITHUB_SHA"

      # Only when the deploy itself succeeded but the live copy then failed its checks.
      # (If deploy.sh failed, it has already left the previous copy live — rolling back
      # again would switch to the copy that just failed.)
      - name: Roll back automatically if the live check failed
        if: ${{ !inputs.rollback && steps.smoke.outcome == 'failure' }}
        run: ssh server rollback
